# Typecheck and tests on every push and pull request.
#
# No network: `npm test` is offline by construction and `scripts/probe.mjs` is
# deliberately not run here. The probe needs a live API token, and the service's
# rate limits are per key over a 60s window — a CI job hitting them would spend
# the same budget a real session needs, and would fail for reasons that say
# nothing about the change under test.
#
# Two Node versions because pi loads this package's TypeScript directly and the
# tests run it through `--experimental-strip-types`: 22 is the oldest line that
# supports it, 24 is what the release workflow publishes from.
name: CI

on:
  push:
  pull_request:

permissions: {}

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One version failing should not hide the result of the other.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Load the TypeScript extension through pi without credentials or network
        env:
          HETZNER_INFERENCE_API_KEY: ""
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-smoke
          PI_HETZNER_DISCOVERY: "false"
          PI_OFFLINE: "1"
        run: |
          mkdir -p "$PI_CODING_AGENT_DIR"
          ./node_modules/.bin/pi -e ./src/index.ts --list-models >/dev/null
