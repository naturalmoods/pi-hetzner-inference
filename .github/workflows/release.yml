# Publishes an exact v* tag to npm through OIDC trusted publishing, then creates
# the matching GitHub Release. Source validation and tests run without OIDC or
# repository-write credentials; each privileged operation has its own job.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.2"
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Fetch and validate the exact tag
        id: source
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          git init --quiet
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --quiet --detach "$TAG^{commit}"
          git fetch --quiet --no-tags origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"

          sha="$(git rev-parse "$TAG^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "Checked-out commit does not match $TAG" >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "The workflow ref does not match $TAG. Dispatch the workflow with --ref $TAG." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "refs/remotes/origin/${{ github.event.repository.default_branch }}"; then
            echo "$TAG is not reachable from ${{ github.event.repository.default_branch }}" >&2
            exit 1
          fi

          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag says ${TAG#v}, package.json says $version" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    name: Check release on Node ${{ matrix.node }}
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish to npm
    needs: [source, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish or verify an earlier successful publish
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$EXPECTED_VERSION" version >/dev/null 2>&1; then
            node <<'NODE'
          const { EXPECTED_SHA: sha, EXPECTED_VERSION: version } = process.env;
          const name = JSON.parse(await (await import("node:fs/promises")).readFile("package.json", "utf8")).name;
          const response = await fetch(`https://registry.npmjs.org/-/npm/v1/attestations/${name}@${version}`);
          if (!response.ok) throw new Error(`Existing package has no readable attestation: HTTP ${response.status}`);
          const document = await response.json();
          const attestation = document.attestations?.find((entry) => entry.predicateType === "https://slsa.dev/provenance/v1");
          if (!attestation) throw new Error("Existing package has no SLSA provenance attestation");
          const statement = JSON.parse(Buffer.from(attestation.bundle.dsseEnvelope.payload, "base64").toString("utf8"));
          const commits = statement.predicate?.buildDefinition?.resolvedDependencies?.map((entry) => entry.digest?.gitCommit);
          if (!commits?.includes(sha)) throw new Error(`Existing package provenance does not reference ${sha}`);
          console.log(`${name}@${version} already exists with provenance for ${sha}; skipping npm publish.`);
          NODE
          else
            npm install --global npm@11.5.1
            npm publish --ignore-scripts --provenance --access public
          fi

  github-release:
    name: Create GitHub Release
    needs: [source, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to do."
            exit 0
          fi
          notes="$(awk -v heading="## ${TAG#v}" '
            $0 == heading || index($0, heading " ") == 1 { inside = 1; next }
            /^## / { inside = 0 }
            inside
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md."
          fi
          gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag
